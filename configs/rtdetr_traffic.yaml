# RT-DETR (Real-Time Detection Transformer) architecture for Traffic Violations
# Eliminates NMS bottlenecks for dense crowd / triple riding detection

# Parameters
nc: 2 # number of classes
scales:
  l: [0.33, 0.50, 1024]

# RT-DETR Hybrid Encoder & Deformable Transformer Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]

# Hybrid Encoder & Multi-Scale Intra-Scale Interaction Head
head:
  - [-1, 1, Conv, [256, 1, 1]] # 9
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [256]] # 12

  - [-1, 1, Conv, [256, 1, 1]] # 13
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 16

  - [[16, 12, 9], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # RT-DETR Set-Prediction Decoder
